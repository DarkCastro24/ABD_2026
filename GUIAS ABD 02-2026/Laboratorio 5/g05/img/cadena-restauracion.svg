<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Restaurar en orden</title><desc id="desc">Se restaura el completo y el diferencial con NORECOVERY, que dejan la base en RESTORING, y el log con RECOVERY, que la deja ONLINE con nueve calificaciones.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#42617f"/></marker></defs><rect width="1000" height="420" rx="16" fill="#f8fafc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="44" font-size="27" fill="#172e49" font-weight="700">Restaurar en orden</text><text x="32" y="75" font-size="17" fill="#52677d" font-weight="400">NORECOVERY deja la base esperando el siguiente respaldo; RECOVERY la abre.</text><rect x="32" y="112" width="216" height="180" rx="12" fill="#eaf1fc" stroke="#275dad" stroke-width="1.5"/><text x="50" y="146" font-size="20" fill="#275dad" font-weight="650">1. Completo</text><text x="50" y="178" font-size="15" fill="#172e49" font-family="Consolas,Cascadia Mono,monospace">WITH NORECOVERY</text><text x="50" y="212" font-size="16" fill="#253c55">Notas 1 a 6</text><text x="50" y="270" font-size="15" fill="#52677d">Estado: </text><text x="108" y="270" font-size="15" fill="#9a5a00" font-weight="700">RESTORING</text><rect x="272" y="112" width="216" height="180" rx="12" fill="#e5f5ef" stroke="#087c61" stroke-width="1.5"/><text x="290" y="146" font-size="20" fill="#087c61" font-weight="650">2. Diferencial</text><text x="290" y="178" font-size="15" fill="#172e49" font-family="Consolas,Cascadia Mono,monospace">WITH NORECOVERY</text><text x="290" y="212" font-size="16" fill="#253c55">+ notas 7 y 8</text><text x="290" y="270" font-size="15" fill="#52677d">Estado: </text><text x="348" y="270" font-size="15" fill="#9a5a00" font-weight="700">RESTORING</text><rect x="512" y="112" width="216" height="180" rx="12" fill="#fdf3e3" stroke="#9a5a00" stroke-width="1.5"/><text x="530" y="146" font-size="20" fill="#9a5a00" font-weight="650">3. Log</text><text x="530" y="178" font-size="15" fill="#172e49" font-family="Consolas,Cascadia Mono,monospace">WITH RECOVERY</text><text x="530" y="212" font-size="16" fill="#253c55">+ nota 9 y</text><text x="530" y="236" font-size="16" fill="#253c55">corrección de la 2</text><text x="530" y="270" font-size="15" fill="#52677d">Estado: </text><text x="588" y="270" font-size="15" fill="#087c61" font-weight="700">ONLINE</text><rect x="752" y="112" width="216" height="180" rx="12" fill="#ffffff" stroke="#087c61" stroke-width="2"/><text x="770" y="146" font-size="20" fill="#087c61" font-weight="650">Base disponible</text><text x="770" y="184" font-size="16" fill="#253c55">9 calificaciones</text><text x="770" y="212" font-size="16" fill="#253c55">nota 2 = 7.25</text><text x="770" y="246" font-size="16" fill="#b5482a" font-weight="600">nota 10: perdida</text><path d="M 248 202 L 272 202" fill="none" stroke="#42617f" stroke-width="2.5" marker-end="url(#a)"/><path d="M 488 202 L 512 202" fill="none" stroke="#42617f" stroke-width="2.5" marker-end="url(#a)"/><path d="M 728 202 L 752 202" fill="none" stroke="#42617f" stroke-width="2.5" marker-end="url(#a)"/><text x="32" y="336" font-size="17" fill="#253c55">Si un paso intermedio utiliza RECOVERY, la base se abre y rechaza los respaldos siguientes.</text><text x="32" y="364" font-size="17" fill="#253c55">Mientras está en RESTORING, la base no admite consultas.</text><text x="32" y="402" font-size="15" fill="#60748a" font-weight="400">NotasLab05 · Laboratorio 5 · Diagrama conceptual</text></g></svg>
