<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">La secuencia de esta guía</title><desc id="desc">Se crean seis calificaciones, un respaldo completo, las calificaciones 7 y 8, un diferencial, la 9 y la corrección de la 2, un respaldo de log y la calificación 10. Después ocurre la falla y la calificación 10 queda sin respaldo.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#42617f"/></marker></defs><rect width="1000" height="450" rx="16" fill="#f8fafc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="44" font-size="27" fill="#172e49" font-weight="700">La secuencia de esta guía</text><text x="32" y="75" font-size="17" fill="#52677d" font-weight="400">Arriba, los cambios en las calificaciones. Abajo, los respaldos que los conservan.</text><rect x="726" y="186" width="176" height="28" fill="#fbe9e2"/><path d="M 40 200 L 960 200" fill="none" stroke="#42617f" stroke-width="3" marker-end="url(#a)"/><g font-size="16" fill="#253c55" text-anchor="middle"><circle cx="80" cy="200" r="9" fill="#42617f"/><text x="80" y="150" font-weight="600">Base creada</text><text x="80" y="172">notas 1 a 6</text><circle cx="320" cy="200" r="9" fill="#42617f"/><text x="320" y="172">notas 7 y 8</text><circle cx="580" cy="200" r="9" fill="#42617f"/><text x="580" y="150">nota 9 y</text><text x="580" y="172">corrección de la 2</text><circle cx="830" cy="200" r="9" fill="#b5482a"/><text x="830" y="172" fill="#b5482a" font-weight="600">nota 10</text></g><circle cx="920" cy="200" r="16" fill="#b5482a"/><path d="M 913 193 L 927 207 M 927 193 L 913 207" stroke="#ffffff" stroke-width="3"/><text x="920" y="150" font-size="16" fill="#b5482a" font-weight="700" text-anchor="middle">Falla</text><text x="920" y="172" font-size="14" fill="#b5482a" text-anchor="middle">DROP DATABASE</text><g text-anchor="middle"><rect x="188" y="188" width="24" height="24" rx="4" fill="#275dad"/><text x="200" y="244" font-size="18" fill="#275dad" font-weight="700">Completo</text><text x="200" y="266" font-size="14" fill="#52677d">NotasLab05_full.bak</text><rect x="438" y="188" width="24" height="24" rx="4" fill="#087c61"/><text x="450" y="244" font-size="18" fill="#087c61" font-weight="700">Diferencial</text><text x="450" y="266" font-size="14" fill="#52677d">NotasLab05_diff.bak</text><rect x="708" y="188" width="24" height="24" rx="4" fill="#9a5a00"/><text x="720" y="244" font-size="18" fill="#9a5a00" font-weight="700">Log</text><text x="720" y="266" font-size="14" fill="#52677d">NotasLab05_log.trn</text></g><text x="814" y="300" font-size="15" fill="#b5482a" font-weight="600" text-anchor="middle">Sin respaldo: se pierde</text><rect x="32" y="330" width="936" height="70" rx="12" fill="#e5f5ef" stroke="#087c61" stroke-width="1.5"/><text x="52" y="360" font-size="18" fill="#172e49" font-weight="600">Después de restaurar quedan 9 calificaciones: la 2 corregida y sin la 10.</text><text x="52" y="386" font-size="16" fill="#253c55">La calificación 10 es la pérdida que mide el RPO.</text><text x="32" y="432" font-size="15" fill="#60748a" font-weight="400">NotasLab05 · Laboratorio 5 · Diagrama conceptual</text></g></svg>
