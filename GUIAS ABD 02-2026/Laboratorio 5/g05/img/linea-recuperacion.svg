<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc"><title id="title">Los objetivos de recuperación en una línea de tiempo</title><desc id="desc">El RPO va del último respaldo a la falla. El RTO va de la falla a los datos restaurados, el WRT hasta los procesos normalizados y el MTD desde la falla hasta el test y la verificación.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#42617f"/></marker></defs><rect width="1000" height="410" rx="16" fill="#f8fafc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="44" font-size="27" fill="#172e49" font-weight="700">Los objetivos de recuperación en una línea de tiempo</text><text x="32" y="75" font-size="17" fill="#52677d" font-weight="400">El RPO se mide hacia atrás desde la falla; RTO, WRT y MTD, hacia adelante.</text><path d="M 40 200 L 960 200" fill="none" stroke="#42617f" stroke-width="3" marker-end="url(#a)"/><text x="958" y="228" font-size="15" fill="#60748a" text-anchor="end">tiempo</text><circle cx="110" cy="200" r="15" fill="#087c61"/><path d="M 103 200 L 109 206 L 118 194" fill="none" stroke="#ffffff" stroke-width="3"/><text x="110" y="166" font-size="17" fill="#253c55" font-weight="600" text-anchor="middle">Último respaldo</text><circle cx="320" cy="200" r="17" fill="#b5482a"/><path d="M 313 193 L 327 207 M 327 193 L 313 207" stroke="#ffffff" stroke-width="3"/><text x="320" y="166" font-size="17" fill="#b5482a" font-weight="700" text-anchor="middle">Falla</text><circle cx="520" cy="200" r="11" fill="#275dad"/><text x="520" y="166" font-size="17" fill="#253c55" font-weight="600" text-anchor="middle">Datos restaurados</text><circle cx="710" cy="200" r="11" fill="#275dad"/><text x="710" y="166" font-size="17" fill="#253c55" font-weight="600" text-anchor="middle">Procesos normalizados</text><circle cx="890" cy="200" r="15" fill="#087c61"/><path d="M 883 200 L 889 206 L 898 194" fill="none" stroke="#ffffff" stroke-width="3"/><text x="890" y="166" font-size="17" fill="#253c55" font-weight="600" text-anchor="middle">Test y verificación</text><path d="M 110 240 L 110 252 L 320 252 L 320 240" fill="none" stroke="#b5482a" stroke-width="2"/><text x="215" y="280" font-size="19" fill="#b5482a" font-weight="700" text-anchor="middle">RPO</text><text x="215" y="304" font-size="15" fill="#253c55" text-anchor="middle">¿Cuántos datos?</text><path d="M 320 240 L 320 252 L 520 252 L 520 240" fill="none" stroke="#275dad" stroke-width="2"/><text x="420" y="280" font-size="19" fill="#275dad" font-weight="700" text-anchor="middle">RTO</text><text x="420" y="304" font-size="15" fill="#253c55" text-anchor="middle">¿Cuánto tiempo?</text><path d="M 520 240 L 520 252 L 710 252 L 710 240" fill="none" stroke="#275dad" stroke-width="2"/><text x="615" y="280" font-size="19" fill="#275dad" font-weight="700" text-anchor="middle">WRT</text><text x="615" y="304" font-size="15" fill="#253c55" text-anchor="middle">Verificar y poner en línea</text><path d="M 320 326 L 320 338 L 890 338 L 890 326" fill="none" stroke="#087c61" stroke-width="2"/><text x="605" y="366" font-size="19" fill="#087c61" font-weight="700" text-anchor="middle">MTD</text><text x="605" y="390" font-size="16" fill="#253c55" text-anchor="middle">Tiempo máximo sin servicio antes de que las consecuencias sean inaceptables</text></g></svg>
