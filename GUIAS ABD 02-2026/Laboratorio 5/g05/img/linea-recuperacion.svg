<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc"><title id="title">Los objetivos de recuperación en una línea de tiempo</title><desc id="desc">El RPO se mide hacia atrás desde la falla hasta el último respaldo. RTO y WRT se miden hacia adelante y juntos no deben superar el MTD.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#42617f"/></marker></defs><rect width="1000" height="410" rx="16" fill="#f8fafc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="44" font-size="27" fill="#172e49" font-weight="700">Los objetivos de recuperación en una línea de tiempo</text><text x="32" y="75" font-size="17" fill="#52677d" font-weight="400">Todos se miden desde la falla: el RPO hacia atrás; RTO, WRT y MTD hacia adelante.</text><path d="M 50 200 L 950 200" fill="none" stroke="#42617f" stroke-width="3" marker-end="url(#a)"/><text x="940" y="228" font-size="15" fill="#60748a" text-anchor="end">tiempo</text><circle cx="150" cy="200" r="15" fill="#087c61"/><path d="M 143 200 L 149 206 L 158 194" fill="none" stroke="#ffffff" stroke-width="3"/><text x="150" y="166" font-size="17" fill="#253c55" font-weight="600" text-anchor="middle">Último respaldo</text><circle cx="400" cy="200" r="17" fill="#b5482a"/><path d="M 393 193 L 407 207 M 407 193 L 393 207" stroke="#ffffff" stroke-width="3"/><text x="400" y="166" font-size="17" fill="#b5482a" font-weight="700" text-anchor="middle">Falla</text><circle cx="620" cy="200" r="11" fill="#275dad"/><text x="620" y="166" font-size="17" fill="#253c55" font-weight="600" text-anchor="middle">Datos restaurados</text><circle cx="840" cy="200" r="11" fill="#275dad"/><text x="840" y="166" font-size="17" fill="#253c55" font-weight="600" text-anchor="middle">Procesos normalizados</text><path d="M 150 240 L 150 252 L 400 252 L 400 240" fill="none" stroke="#b5482a" stroke-width="2"/><text x="275" y="280" font-size="19" fill="#b5482a" font-weight="700" text-anchor="middle">RPO</text><text x="275" y="304" font-size="16" fill="#253c55" text-anchor="middle">¿Cuántos datos se pierden?</text><path d="M 400 240 L 400 252 L 620 252 L 620 240" fill="none" stroke="#275dad" stroke-width="2"/><text x="510" y="280" font-size="19" fill="#275dad" font-weight="700" text-anchor="middle">RTO</text><text x="510" y="304" font-size="16" fill="#253c55" text-anchor="middle">Tiempo para restaurar</text><path d="M 620 240 L 620 252 L 840 252 L 840 240" fill="none" stroke="#275dad" stroke-width="2"/><text x="730" y="280" font-size="19" fill="#275dad" font-weight="700" text-anchor="middle">WRT</text><text x="730" y="304" font-size="16" fill="#253c55" text-anchor="middle">Verificar y poner en línea</text><path d="M 400 326 L 400 338 L 840 338 L 840 326" fill="none" stroke="#087c61" stroke-width="2"/><text x="620" y="366" font-size="19" fill="#087c61" font-weight="700" text-anchor="middle">MTD</text><text x="620" y="390" font-size="16" fill="#253c55" text-anchor="middle">Máximo tiempo sin servicio que tolera el negocio: RTO + WRT ≤ MTD</text></g></svg>
