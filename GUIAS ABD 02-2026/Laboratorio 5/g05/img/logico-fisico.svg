<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" role="img" aria-labelledby="title desc"><title id="title">Respaldo lógico y respaldo nativo</title><desc id="desc">El lógico exporta esquemas o datos, en texto o formato nativo. BACKUP crea un respaldo consistente de SQL Server.</desc><rect width="1000" height="404" rx="16" fill="#f8fafc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="44" font-size="27" fill="#172e49" font-weight="700">Respaldo lógico y respaldo nativo</text><text x="32" y="75" font-size="17" fill="#52677d" font-weight="400">Los dos guardan datos, pero con formatos y propósitos distintos.</text><rect x="32" y="110" width="452" height="236" rx="12" fill="#eaf1fc" stroke="#275dad" stroke-width="1.5"/><text x="52" y="146" font-size="21" fill="#275dad" font-weight="650">Respaldo lógico</text><text x="52" y="178" font-size="17" fill="#253c55">Exporta esquemas o datos, en texto o binario.</text><text x="52" y="214" font-size="17" fill="#253c55"><tspan font-weight="600">Generar scripts</tspan> → archivo .sql</text><text x="52" y="242" font-size="17" fill="#253c55"><tspan font-weight="600">sqlcmd</tspan> → resultado de una consulta</text><text x="52" y="270" font-size="17" fill="#253c55"><tspan font-weight="600">bcp</tspan> → datos de una tabla</text><text x="52" y="316" font-size="17" fill="#172e49" font-weight="600">Uso: migraciones y copias parciales.</text><rect x="516" y="110" width="452" height="236" rx="12" fill="#e5f5ef" stroke="#087c61" stroke-width="1.5"/><text x="536" y="146" font-size="21" fill="#087c61" font-weight="650">Respaldo nativo de SQL Server</text><text x="536" y="178" font-size="17" fill="#253c55">BACKUP conserva datos y registro necesario.</text><text x="536" y="214" font-size="17" fill="#253c55"><tspan font-weight="600">Completo</tspan> → archivo .bak</text><text x="536" y="242" font-size="17" fill="#253c55"><tspan font-weight="600">Diferencial</tspan> → archivo .bak</text><text x="536" y="270" font-size="17" fill="#253c55"><tspan font-weight="600">Log</tspan> → archivo .trn</text><text x="536" y="316" font-size="17" fill="#172e49" font-weight="600">Uso: recuperar la base completa.</text><text x="32" y="382" font-size="18" fill="#253c55">La recuperación depende de los respaldos disponibles y de su secuencia.</text></g></svg>
