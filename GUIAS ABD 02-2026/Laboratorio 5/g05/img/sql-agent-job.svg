<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 366" role="img" aria-labelledby="title desc"><title id="title">Un job de respaldo en SQL Agent</title><desc id="desc">El job contiene un paso con el BACKUP DATABASE y una programación diaria a las 22:00 del servidor. Si el job falla, se notifica por correo al operador operador1.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#42617f"/></marker></defs><rect width="1000" height="366" rx="16" fill="#f8fafc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="44" font-size="27" fill="#172e49" font-weight="700">Un job de respaldo en SQL Agent</text><text x="32" y="75" font-size="17" fill="#52677d" font-weight="400">El servicio ejecuta el paso del job cuando llega su programación o cuando se inicia a mano.</text><rect x="32" y="110" width="290" height="140" rx="12" fill="#eaf1fc" stroke="#275dad" stroke-width="1.5"/><text x="52" y="144" font-size="20" fill="#275dad" font-weight="650">Job</text><text x="52" y="178" font-size="17" fill="#253c55">Respaldo diario NotasLab05</text><text x="52" y="206" font-size="15" fill="#52677d">sp_add_job · sp_add_jobserver</text><rect x="355" y="110" width="290" height="140" rx="12" fill="#e5f5ef" stroke="#087c61" stroke-width="1.5"/><text x="375" y="144" font-size="20" fill="#087c61" font-weight="650">Step</text><text x="375" y="178" font-size="15" fill="#172e49" font-family="Consolas,Cascadia Mono,monospace">BACKUP DATABASE NotasLab05</text><text x="375" y="202" font-size="15" fill="#172e49" font-family="Consolas,Cascadia Mono,monospace">WITH INIT, COMPRESSION</text><text x="375" y="230" font-size="15" fill="#52677d">sp_add_jobstep</text><rect x="678" y="110" width="290" height="140" rx="12" fill="#fdf3e3" stroke="#9a5a00" stroke-width="1.5"/><text x="698" y="144" font-size="20" fill="#9a5a00" font-weight="650">Schedule</text><text x="698" y="178" font-size="17" fill="#253c55">Diario a las 22:00</text><text x="698" y="202" font-size="15" fill="#253c55">hora del servidor (UTC)</text><text x="698" y="230" font-size="15" fill="#52677d">sp_add_schedule</text><path d="M 322 180 L 355 180" fill="none" stroke="#42617f" stroke-width="2.5" marker-end="url(#a)"/><path d="M 678 180 L 645 180" fill="none" stroke="#42617f" stroke-width="2.5" marker-end="url(#a)"/><path d="M 500 250 L 500 282" fill="none" stroke="#42617f" stroke-width="2.5" marker-end="url(#a)"/><rect x="32" y="284" width="936" height="58" rx="12" fill="#ffffff" stroke="#b9cbe0" stroke-width="1.5"/><text x="52" y="319" font-size="17" fill="#253c55"><tspan font-weight="600">Operador:</tspan> si el job falla, SQL Agent notifica por correo a operador1.</text></g></svg>
