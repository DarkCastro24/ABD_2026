<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 472" role="img" aria-labelledby="title desc"><title id="title">Qué cubre cada tipo de respaldo</title><desc id="desc">El completo copia toda la base el domingo. Cada diferencial incluye los cambios desde ese completo y crece día a día. Cada respaldo incremental o de log incluye solo lo ocurrido desde el anterior.</desc><rect width="1000" height="472" rx="16" fill="#f8fafc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="44" font-size="27" fill="#172e49" font-weight="700">Qué cubre cada tipo de respaldo</text><text x="32" y="75" font-size="17" fill="#52677d" font-weight="400">Ejemplo de una semana: completo el domingo, diferenciales diarios e incrementales cada 6 horas.</text><g font-size="16" fill="#52677d" text-anchor="middle" font-weight="600"><text x="230" y="116">Dom</text><text x="400" y="116">Lun</text><text x="570" y="116">Mar</text><text x="740" y="116">Mié</text><text x="910" y="116">Jue</text></g><g stroke="#c9d5e3" stroke-width="1.5" stroke-dasharray="5 5"><path d="M 230 128 L 230 372"/><path d="M 400 128 L 400 372"/><path d="M 570 128 L 570 372"/><path d="M 740 128 L 740 372"/><path d="M 910 128 L 910 372"/></g><text x="32" y="168" font-size="20" fill="#275dad" font-weight="700">Completo</text><rect x="218" y="146" width="24" height="32" rx="4" fill="#275dad"/><text x="258" y="168" font-size="17" fill="#253c55">Copia el 100 % de la base.</text><text x="32" y="232" font-size="20" fill="#087c61" font-weight="700">Diferencial</text><rect x="230" y="204" width="170" height="12" rx="3" fill="#087c61" fill-opacity="0.5"/><rect x="230" y="222" width="340" height="12" rx="3" fill="#087c61" fill-opacity="0.72"/><rect x="230" y="240" width="510" height="12" rx="3" fill="#087c61" fill-opacity="0.95"/><text x="230" y="280" font-size="16" fill="#253c55">Cada uno incluye todos los cambios desde el último completo, por eso crece.</text><text x="32" y="330" font-size="20" fill="#9a5a00" font-weight="700">Incremental</text><text x="32" y="352" font-size="15" fill="#9a5a00">(log en SQL Server)</text><g fill="#d08a1e"><rect x="230" y="314" width="40.5" height="22" rx="3"/><rect x="315" y="314" width="40.5" height="22" rx="3"/><rect x="400" y="314" width="40.5" height="22" rx="3"/><rect x="485" y="314" width="40.5" height="22" rx="3"/><rect x="570" y="314" width="40.5" height="22" rx="3"/><rect x="655" y="314" width="40.5" height="22" rx="3"/><rect x="740" y="314" width="40.5" height="22" rx="3"/><rect x="825" y="314" width="40.5" height="22" rx="3"/></g><g fill="#ecc27c"><rect x="272.5" y="314" width="40.5" height="22" rx="3"/><rect x="357.5" y="314" width="40.5" height="22" rx="3"/><rect x="442.5" y="314" width="40.5" height="22" rx="3"/><rect x="527.5" y="314" width="40.5" height="22" rx="3"/><rect x="612.5" y="314" width="40.5" height="22" rx="3"/><rect x="697.5" y="314" width="40.5" height="22" rx="3"/><rect x="782.5" y="314" width="40.5" height="22" rx="3"/><rect x="867.5" y="314" width="40.5" height="22" rx="3"/></g><text x="230" y="362" font-size="16" fill="#253c55">Cada uno incluye solo lo ocurrido desde el respaldo anterior.</text><rect x="32" y="392" width="936" height="58" rx="12" fill="#eaf1fc" stroke="#275dad" stroke-width="1.5"/><text x="52" y="428" font-size="18" fill="#172e49" font-weight="600">Para restaurar: completo, último diferencial e incrementales posteriores, en orden.</text></g></svg>
